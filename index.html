<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>V30 - YARYA ZAXO PRO - هەفرکیا خێزانێ 🏆🐥 - Render Only</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(130% 100% at 15% 0%, #2a1a4a 0%, #151a33 30%, #080b1a 70%);font-family:'Noto Sans Arabic',sans-serif;color:#fff;min-height:100vh}
.app{max-width:420px;margin:0 auto;padding:16px}
.card{background:linear-gradient(180deg, rgba(22,22,52,0.95), rgba(16,16,40,0.98));border:1px solid rgba(247,198,0,0.15);border-radius:28px;padding:20px;margin-bottom:16px}
.btn{width:100%;height:50px;border-radius:999px;border:0;background:linear-gradient(180deg, #ffe27a, #F7C600);color:#1a1200;font-weight:900;font-size:14px;cursor:pointer;margin-top:10px}
input{width:100%;height:48px;border-radius:16px;border:1.5px solid rgba(255,255,255,0.1);background:rgba(8,8,20,0.85);color:#fff;padding:0 14px;font-size:14px;margin-bottom:10px;font-family:'Noto Sans Arabic'}
h1{text-align:center;color:#F7C600;font-size:22px;font-weight:900}
.leader{margin-top:12px}
.row{display:flex;justify-content:space-between;padding:10px 12px;background:rgba(0,0,0,0.25);border-radius:12px;margin-bottom:6px}
.timer{font-family:monospace;font-size:22px;text-align:center;margin:12px 0;color:#7CFC9A;font-weight:900}
</style>
</head>
<body>
<div class="app">
<div class="card">
<h1>YARYA ZAXO PRO 🏆🐥</h1>
<p style="text-align:center;color:rgba(255,255,255,0.6);font-size:12px;margin-top:6px">V30 - Render Only - بێ دەرەکی - 0$ داتابەیس</p>
<div id="authBox">
<input id="nameInput" placeholder="ناڤێ تە">
<input id="passInput" type="password" placeholder="وشەیا نهێنی">
<button class="btn" onclick="register()">چوونە ژوورەوە / تومارکرن</button>
</div>
<div id="gameBox" style="display:none">
<div style="text-align:center">
<div>ناڤ: <b id="myName"></b> | سکۆر: <b id="myScore" style="color:#F7C600">0</b></div>
<button class="btn" onclick="addScore()">➕ سکۆر زیاد بکە</button>
<div class="timer" id="countdown">--:--:--</div>
</div>
<div class="leader">
<h3 style="color:#F7C600;margin:12px 0">🏆 رێزبەندی - بەلاش</h3>
<div id="leaderList">بار دبیت...</div>
</div>
</div>
</div>
</div>
<script>
let currentUser = null;
let myScoreVal = 0;

async function register(){
  const name = document.getElementById('nameInput').value.trim();
  const pass = document.getElementById('passInput').value.trim();
  if(!name || pass.length<3){ alert('ناڤ و وشەیا نهێنی بنڤیسە'); return; }
  const id = name.toLowerCase();
  // check existing
  let res = await fetch('/api/users/'+encodeURIComponent(id));
  if(res.ok){
    const u = await res.json();
    if(u.password !== btoa(pass) && u.password !== pass){ alert('وشەیا نهێنی خەلەتە'); return; }
    currentUser = u;
  } else {
    const newUser = {username:name, usernameLower:id, password:btoa(pass), bestScore:0, bestScoreFree:0, createdAt:new Date().toISOString()};
    res = await fetch('/api/users/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(newUser)});
    currentUser = await res.json();
  }
  localStorage.setItem('yarya_user', JSON.stringify(currentUser));
  showGame();
}

function showGame(){
  document.getElementById('authBox').style.display='none';
  document.getElementById('gameBox').style.display='block';
  document.getElementById('myName').textContent = currentUser.username;
  myScoreVal = currentUser.bestScore||0;
  document.getElementById('myScore').textContent = myScoreVal;
  loadLeaderboard();
  loadConfig();
}

async function addScore(){
  myScoreVal += Math.floor(Math.random()*10)+1;
  document.getElementById('myScore').textContent = myScoreVal;
  await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:currentUser.usernameLower, username:currentUser.username, score:myScoreVal, type:'free'})});
  loadLeaderboard();
}

async function loadLeaderboard(){
  try{
    const r = await fetch('/api/leaderboard?type=free');
    const list = await r.json();
    const el = document.getElementById('leaderList');
    if(list.length===0){ el.innerHTML='<div style="text-align:center;color:#888">هێشتا کەس نینە</div>'; return; }
    el.innerHTML = list.slice(0,10).map((u,i)=>`<div class="row"><span>${i+1}. ${u.username||u._id}</span><span style="color:#00ff88;font-weight:900">${u.bestScoreFree||u.bestScore||0}</span></div>`).join('');
  }catch(e){ console.error(e); }
}

async function loadConfig(){
  try{
    const r = await fetch('/api/settings/config');
    const cfg = await r.json();
    if(cfg.freeEndAt){
      const end = new Date(cfg.freeEndAt);
      setInterval(()=>{
        const diff = Math.max(0, end - new Date());
        const h = Math.floor(diff/3600000); const m = Math.floor((diff%3600000)/60000); const s = Math.floor((diff%60000)/1000);
        document.getElementById('countdown').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      },1000);
    }
  }catch(e){}
}

// auto login
try{
  const saved = localStorage.getItem('yarya_user');
  if(saved){ currentUser = JSON.parse(saved); showGame(); }
}catch(e){}

setInterval(loadLeaderboard, 5000);
</script>
</body>
</html>
